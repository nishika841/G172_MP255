apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp255-api
  labels:
    app: mp255-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp255-api
  template:
    metadata:
      labels:
        app: mp255-api
    spec:
      containers:
        - name: api
          image: mp255-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
